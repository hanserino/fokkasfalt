name = "fokkasfalt-patreon-gate"
main = "src/index.js"
compatibility_date = "2026-11-13"

# Public config. Secrets: wrangler secret put PATREON_CLIENT_ID / PATREON_CLIENT_SECRET /
# PATREON_ALLOW_USER_IDS / SESSION_SECRET / CALENDAR_JSON
[vars]
ALLOWED_ORIGINS = "https://fokkasfalt.no,https://www.fokkasfalt.no,http://127.0.0.1:4000,http://localhost:4000"
# Campaign: Nå Er Det Alvor / Føkk Asfalt. Any active patron (free or paid) can log in.
PATREON_CAMPAIGN_ID = "1555279"
# Slack is only for the Føkk Asfalt tier.
SLACK_TIER_IDS = "7252533"
PATREON_TIER_IDS = "7252533,2543654,27436916"

[[kv_namespaces]]
binding = "CALENDAR"
id = "3220839817a84afc8eae1593f7bd18a7"
